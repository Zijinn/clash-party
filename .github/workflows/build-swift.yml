name: Build Swift for macOS

on:
  push:
    branches:
      - main
      - develop
      - 'feature/swift-*'
    tags:
      - 'v*'
    paths:
      - 'ClashParty/**'
      - 'ClashParty.xcodeproj/**'
      - 'Package.swift'
      - 'Makefile'
      - 'create-dmg.sh'
      - '.github/workflows/build-swift.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'ClashParty/**'
      - 'ClashParty.xcodeproj/**'
      - 'Package.swift'
      - 'Makefile'
      - 'create-dmg.sh'
      - '.github/workflows/build-swift.yml'

jobs:
  build:
    name: Build Swift Version
    runs-on: macos-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Show Swift version
        run: swift --version
      
      - name: Build Swift version
        run: |
          xcodebuild -project ClashParty.xcodeproj \
            -scheme ClashParty \
            -configuration Release \
            -derivedDataPath .build \
            build
      
      - name: Check build output
        run: |
          ls -lah .build/Build/Products/Release/
          file .build/Build/Products/Release/ClashParty.app/Contents/MacOS/ClashParty
      
      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' ClashParty.xcodeproj/project.pbxproj | sed -e 's/.*= \(.*\);/\1/' | tr -d ' ' || echo "1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Create DMG
        if: github.event_name == 'push'
        run: |
          chmod +x create-dmg.sh
          ./create-dmg.sh .build/Build/Products/Release/ClashParty.app ${{ steps.get_version.outputs.version }}
      
      - name: Archive application (ZIP)
        if: github.event_name == 'push'
        run: |
          cd .build/Build/Products/Release
          zip -r ClashParty.app.zip ClashParty.app
      
      - name: Upload ZIP artifact
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ClashParty-macOS-ZIP-${{ github.sha }}
          path: .build/Build/Products/Release/ClashParty.app.zip
          retention-days: 7
      
      - name: Upload DMG artifact
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ClashParty-macOS-DMG-${{ github.sha }}
          path: |
            .build/*.dmg
            .build/*.dmg.sha256
          retention-days: 7
      
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/*.dmg
            .build/*.dmg.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Swift build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** macOS" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** Universal (arm64 + x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:** Release" >> $GITHUB_STEP_SUMMARY
          echo "**App Bundle:** ClashParty.app" >> $GITHUB_STEP_SUMMARY
          if ls .build/*.dmg 1> /dev/null 2>&1; then
            echo "**Package Format:** DMG" >> $GITHUB_STEP_SUMMARY
            echo "**DMG File:** $(basename .build/*.dmg)" >> $GITHUB_STEP_SUMMARY
          fi

  lint:
    name: Swift Lint
    runs-on: macos-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Swift formatting
        run: |
          swift --version
          # Add swift-format checks when configured
          echo "Swift lint checks would run here"
      
      - name: Count Swift files
        run: |
          SWIFT_FILES=$(find ClashParty -name "*.swift" | wc -l)
          SWIFT_LINES=$(find ClashParty -name "*.swift" -exec wc -l {} + | tail -1 | awk '{print $1}')
          echo "Swift files: $SWIFT_FILES"
          echo "Swift lines: $SWIFT_LINES"
          echo "## Code Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Swift files: **$SWIFT_FILES**" >> $GITHUB_STEP_SUMMARY
          echo "- Lines of code: **$SWIFT_LINES**" >> $GITHUB_STEP_SUMMARY
